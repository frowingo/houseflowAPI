app = 'houseflowapi'
primary_region = 'ams'

[build]

[deploy]
  release_command = './houseflowapi migrate'
  release_command_timeout = '5m'

[http_service]
  internal_port = 3162
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '15s'
    interval = '30s'
    method = 'GET'
    timeout = '3s'
    path = '/api/v1/base/health/ready'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
