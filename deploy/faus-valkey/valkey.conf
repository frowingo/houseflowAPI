# Coordination store for houseflowapi. The password is passed on the command
# line from the VALKEY_PASSWORD secret (see Dockerfile).

# Fly Proxy (Flycast) connects over IPv4, 6PN (.internal) over IPv6.
bind * -::*
port 6379
protected-mode yes
tcp-keepalive 60
timeout 0

# The machine stops with the API; AOF on the volume keeps runtime checkpoints
# across those stops. RDB snapshots are off to avoid a second fork.
dir /data
appendonly yes
appendfsync everysec
save ""

# Leases and command streams must never be evicted silently. Leave headroom
# under the VM memory for the AOF rewrite fork.
maxmemory 128mb
maxmemory-policy noeviction

loglevel notice
