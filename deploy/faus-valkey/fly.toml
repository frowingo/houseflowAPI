app = 'faus-valkey'
primary_region = 'ams'
kill_signal = 'SIGTERM'
kill_timeout = 30
swap_size_mb = 256

[build]
  dockerfile = 'Dockerfile'

[mounts]
  source = 'valkey_data'
  destination = '/data'

# Reached only through Flycast (faus-valkey.flycast), so Fly Proxy starts the
# machine when the API connects and stops it a few minutes after the API's
# connections close. For always-on: auto_stop_machines = 'off' and
# min_machines_running = 1.
[[services]]
  protocol = 'tcp'
  internal_port = 6379
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 6379

  [services.concurrency]
    type = 'connections'
    soft_limit = 500
    hard_limit = 1000

  [[services.tcp_checks]]
    grace_period = '10s'
    interval = '30s'
    timeout = '2s'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
