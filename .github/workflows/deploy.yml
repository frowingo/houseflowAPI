name: Deploy to Fly.io

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: houseflow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./... -count=1

      - name: Start integration dependencies
        run: |
          docker compose up -d --wait redis
          docker compose up -d mongodb mongodb-init
          docker compose wait mongodb-init

      - name: Run integration tests
        run: docker compose --profile test run --rm --no-deps integrationTests

      - name: Stop test containers
        if: always()
        run: docker compose --profile test down --volumes

  deploy:
    name: Deploy
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Validate deployment secrets
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RESET_CODE_SECRET: ${{ secrets.RESET_CODE_SECRET }}
          JOIN_CODE_SECRET: ${{ secrets.JOIN_CODE_SECRET }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          test -n "$MONGO_URI"
          test -n "$REDIS_URL"
          test -n "$JWT_SECRET"
          test -n "$RESET_CODE_SECRET"
          test -n "$JOIN_CODE_SECRET"
          test -n "$SMTP_PASSWORD"
          test -n "$FLY_API_TOKEN"

      - name: Set secrets on Fly.io
        run: >-
          flyctl secrets set
          MONGO_URI="${{ secrets.MONGO_URI }}"
          REDIS_URL="${{ secrets.REDIS_URL }}"
          JWT_SECRET="${{ secrets.JWT_SECRET }}"
          RESET_CODE_SECRET="${{ secrets.RESET_CODE_SECRET }}"
          JOIN_CODE_SECRET="${{ secrets.JOIN_CODE_SECRET }}"
          SMTP_PASSWORD="${{ secrets.SMTP_PASSWORD }}"
          APP_ENV="production"
          --app houseflowapi
          --stage
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
