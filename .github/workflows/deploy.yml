name: Deploy to Fly.io

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: houseflow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The CI override publishes Redis to the runner; MongoDB already is.
      COMPOSE_FILE: docker-compose.yml:.github/ci/docker-compose.ci.yml
      HOUSEFLOW_TEST_MONGO_URI: mongodb://mongodb:27017/?replicaSet=rs0
      HOUSEFLOW_TEST_REDIS_URL: redis://127.0.0.1:6379/1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Start integration dependencies
        run: |
          docker compose up -d --wait redis
          docker compose up -d mongodb mongodb-init
          docker compose wait mongodb-init
          # The replica set names its member mongodb:27017, as inside compose;
          # the runner reaches it through the published port.
          echo "127.0.0.1 mongodb" | sudo tee -a /etc/hosts

      # One run covers unit and integration tests: without the two variables
      # above the integration tests skip, so a separate unit run would repeat
      # only tests this run executes anyway. The build cache comes from
      # setup-go; the explicit timeout replaces go test's 10 minute default.
      - name: Test with race detector
        run: go test -race -count=1 -timeout 20m ./...

      - name: Stop test containers
        if: always()
        run: docker compose down --volumes

  # A cache saved by a pull request run is visible only to that pull request;
  # every pull request can restore the base branch's. This job saves the
  # module and race build cache on master, next to the deploy, so the next
  # PR's verification does not start cold. It does not gate the deploy.
  warm-cache:
    name: Warm Go cache
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build vet and race test binaries
        run: |
          go vet ./...
          go test -race -count=1 -run '^$' ./...

  deploy:
    name: Deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Validate deployment secrets
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RESET_CODE_SECRET: ${{ secrets.RESET_CODE_SECRET }}
          JOIN_CODE_SECRET: ${{ secrets.JOIN_CODE_SECRET }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          test -n "$MONGO_URI"
          test -n "$REDIS_URL"
          test -n "$JWT_SECRET"
          test -n "$RESET_CODE_SECRET"
          test -n "$JOIN_CODE_SECRET"
          test -n "$SMTP_PASSWORD"
          test -n "$FLY_API_TOKEN"

      - name: Set secrets on Fly.io
        run: >-
          flyctl secrets set
          MONGO_URI="${{ secrets.MONGO_URI }}"
          REDIS_URL="${{ secrets.REDIS_URL }}"
          JWT_SECRET="${{ secrets.JWT_SECRET }}"
          RESET_CODE_SECRET="${{ secrets.RESET_CODE_SECRET }}"
          JOIN_CODE_SECRET="${{ secrets.JOIN_CODE_SECRET }}"
          SMTP_PASSWORD="${{ secrets.SMTP_PASSWORD }}"
          APP_ENV="production"
          REALTIME_MAX_OWNED_ROOMS="4"
          REALTIME_MAX_CONNECTIONS="32"
          --app houseflowapi
          --stage
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
