host: localhost:3162
info:
  contact:
    email: support@houseflow.com
    name: API Support
  description: HouseFlow API Documentation
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: HouseFlow API
  version: "1.0"
paths:
  /auth/forget:
    post:
      consumes:
      - application/json
      description: Generates a 6-character reset code for the given email and sends
        it to the user's email address.
      parameters:
      - description: Email address
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/houseflowApi_internal_models_dtos.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Operation status
          schema:
            $ref: '#/definitions/houseflowApi_internal_models_dtos.SuccessResponseModel'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/houseflowApi_internal_models_dtos.SuccessResponseModel'
      summary: Forgot Password
      tags:
      - Auth
  /auth/isAuth:
    get:
      description: Returns true if the token has not expired, false otherwise
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/houseflowApi_internal_models_dtos.IsAuthResponseModel'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/houseflowApi_internal_models_dtos.IsAuthResponseModel'
      security:
      - BearerAuth: []
      summary: Check if token is valid
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login with email and password to receive JWT token
      parameters:
      - description: Login credentials
        in: body
        name: login
        required: true
        schema:
          $ref: '#/definitions/houseflowApi_internal_models_dtos.LoginRequestModel'
      produces:
      - application/json
      responses:
        "200":
          description: Returns JWT token
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Invalid credentials
          schema:
            additionalProperties: true
            type: object
      summary: User Login
      tags:
      - Auth
  /auth/reset:
    post:
      consumes:
      - application/json
      description: Verifies the 6-character reset code and updates the user's password.
      parameters:
      - description: Reset credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/houseflowApi_internal_models_dtos.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password updated
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request or invalid code
          schema:
            additionalProperties: true
            type: object
      summary: Reset Password
      tags:
      - Auth
  /auth/signup:
    post:
      consumes:
      - application/json
      description: Signup with email, password, firstname, and lastname to receive
        JWT token
      parameters:
      - description: Signup request
        in: body
        name: signup
        required: true
        schema:
          $ref: '#/definitions/houseflowApi_internal_models_dtos.SignUpUserModel'
      produces:
      - application/json
      responses:
        "201":
          description: Returns JWT token
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Invalid credentials
          schema:
            additionalProperties: true
            type: object
      summary: User Signup
