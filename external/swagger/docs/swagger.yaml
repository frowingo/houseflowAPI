host: localhost:3162
info:
  contact:
    email: support@houseflow.com
    name: API Support
  description: HouseFlow API Documentation
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: HouseFlow API
  version: "1.0"
paths:
  /auth/apple/notifications:
    post:
      consumes:
      - application/json
      description: Endpoint registered in the Apple Developer portal for Sign in with
        Apple notifications. The JSON field payload is a JWT signed by Apple. consent-revoked
        removes the Apple link; account-delete deletes the account; email events are
        acknowledged without changes.
      parameters:
      - description: Apple notification
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/houseflowApi_internal_models_dtos.AppleNotificationRequestModel'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/houseflowApi_internal_models_dtos.SuccessResponseModel'
        "400":
          description: Apple sign-in is not enabled
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Payload not verified
          schema:
            additionalProperties: true
            type: object
      summary: Apple Server-to-Server Notification
      tags:
      - Auth
  /auth/facebook/data-deletion:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Called by Facebook when a user removes the app and asks for their
        data to be deleted. The form field signed_request is verified with the app
        secret; the linked account is deleted. Returns the status URL and confirmation
        code Facebook shows to the user.
      parameters:
      - description: Facebook signed request
        in: formData
        name: signed_request
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/houseflowApi_internal_models_dtos.FacebookDataDeletionResponseModel'
        "400":
          description: Facebook sign-in is not enabled
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Invalid signature
          schema:
            additionalProperties: true
            type: object
      summary: Facebook Data Deletion Callback
      tags:
      - Auth
  /auth/facebook/data-deletion/{code}:
    get:
      description: Shows the status of a data deletion request by the confirmation
        code given to Facebook.
      parameters:
      - description: Confirmation code
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/houseflowApi_internal_models_dtos.DataDeletionStatusResponseModel'
        "404":
          description: Unknown code
          schema:
            additionalProperties: true
            type: object
      summary: Data Deletion Status
      tags:
      - Auth
  /auth/forget:
    post:
      consumes:
      - application/json
      description: Generates a 6-character reset code for the given email and sends
        it to the user's email address.
      parameters:
      - description: Email address
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/houseflowApi_internal_models_dtos.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Operation status
          schema:
            $ref: '#/definitions/houseflowApi_internal_models_dtos.SuccessResponseModel'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/houseflowApi_internal_models_dtos.SuccessResponseModel'
      summary: Forgot Password
      tags:
      - Auth
  /auth/isAuth:
    get:
      description: Returns true if the token has not expired, false otherwise
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/houseflowApi_internal_models_dtos.IsAuthResponseModel'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/houseflowApi_internal_models_dtos.IsAuthResponseModel'
      security:
      - BearerAuth: []
      summary: Check if token is valid
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login with email and password to receive JWT token
      parameters:
      - description: Login credentials
        in: body
        name: login
        required: true
        schema:
          $ref: '#/definitions/houseflowApi_internal_models_dtos.LoginRequestModel'
      produces:
      - application/json
      responses:
        "200":
          description: Returns JWT token
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Invalid credentials
          schema:
            additionalProperties: true
            type: object
      summary: User Login
      tags:
      - Auth
  /auth/reset:
    post:
      consumes:
      - application/json
      description: Verifies the 6-character reset code and updates the user's password.
      parameters:
      - description: Reset credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/houseflowApi_internal_models_dtos.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password updated
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request or invalid code
          schema:
            additionalProperties: true
            type: object
      summary: Reset Password
      tags:
      - Auth
  /auth/signup:
    post:
      consumes:
      - application/json
      description: Signup with email, password, firstname, and lastname to receive
        JWT token. The account language (tr or en, used for push notifications) comes
        from Accept-Language; anything else is stored as en.
      parameters:
      - description: 'Account language: tr or en (default en)'
        in: header
        name: Accept-Language
        type: string
      - description: Signup request
        in: body
        name: signup
        required: true
        schema:
          $ref: '#/definitions/houseflowApi_internal_models_dtos.SignUpUserModel'
      produces:
      - application/json
      responses:
        "201":
          description: Returns JWT token
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Invalid credentials
          schema:
            additionalProperties: true
            type: object
      summary: User Signup
      tags:
      - Auth
  /auth/social/{provider}:
    post:
      consumes:
      - application/json
      description: 'Signs in with a Google, Apple or Facebook credential, creating
        the account on first use. Google sends idToken (and nonce if one was used).
        Apple sends idToken, the raw nonce whose SHA-256 hex digest was given to Apple,
        and on the first authorization authorizationCode, firstName and lastName.
        Facebook sends accessToken (classic login) or idToken with the nonce given
        to the SDK (iOS Limited Login). Snapchat sends the Login Kit accessToken.
        Returns 201 when a new account was created. When the provider shares no email
        the reply is 200 with needsEmail and a pendingToken: request a code with /auth/social/complete/code,
        then finish with /auth/social/complete.'
      parameters:
      - description: Provider
        enum:
        - google
        - apple
        - facebook
        - snapchat
        in: path
        name: provider
        required: true
        type: string
      - description: Provider credential
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/houseflowApi_internal_models_dtos.SocialAuthRequestModel'
      produces:
      - application/json
      responses:
        "200":
          description: Signed in to an existing account
          schema:
            $ref: '#/definitions/houseflowApi_internal_models_dtos.SocialAuthResponseModel'
        "201":
          description: New account created
          schema:
            $ref: '#/definitions/houseflowApi_internal_models_dtos.SocialAuthResponseModel'
        "400":
          description: Bad request, provider not supported or email missing
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Provider credential could not be verified
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Email registered with another sign-in method
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Provider temporarily unavailable
          schema:
            additionalProperties: true
            type: object
      summary: Social Sign-In
      tags:
      - Auth
  /auth/social/{provider}/link:
    delete:
      description: 'Disconnects a provider from the signed-in user. The last way to
        sign in cannot be removed: without a password at least one provider stays.
        A linked Apple authorization is revoked.'
      parameters:
      - description: Provider
        enum:
        - google
        - apple
        - facebook
        - snapchat
        in: path
        name: provider
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/houseflowApi_internal_models_dtos.LinkedProvidersResponseModel'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Provider not linked
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Last sign-in method
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Unlink Social Provider
      tags:
      - Auth
    post:
      consumes:
      - application/json
      description: Connects a provider account to the signed-in user so they can also
        sign in with it. The body is the same provider credential as /auth/social/{provider};
        Apple also needs authorizationCode. Returns the providers now linked.
      parameters:
      - description: Provider
        enum:
        - google
        - apple
        - facebook
        - snapchat
        in: path
        name: provider
        required: true
        type: string
      - description: Provider credential
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/houseflowApi_internal_models_dtos.SocialAuthRequestModel'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/houseflowApi_internal_models_dtos.LinkedProvidersResponseModel'
        "400":
          description: Bad request or provider not supported
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized or credential not verified
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Provider account linked to another user, or another account
            of this provider already connected
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Link Social Provider
      tags:
      - Auth
  /auth/social/complete:
    post:
      consumes:
      - application/json
      description: 'Last step of an email-less social sign-up: checks the emailed
        code and creates the account with a verified email. Returns 201 with our token;
        200 when the provider account finished signing up meanwhile.'
      parameters:
      - description: Pending sign-up, email and code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/houseflowApi_internal_models_dtos.CompleteSocialSignUpRequestModel'
      produces:
      - application/json
      responses:
        "200":
          description: Signed in to an existing account
          schema:
            $ref: '#/definitions/houseflowApi_internal_models_dtos.SocialAuthResponseModel'
        "201":
          description: New account created
          schema:
            $ref: '#/definitions/houseflowApi_internal_models_dtos.SocialAuthResponseModel'
        "400":
          description: Bad request or invalid code
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Pending sign-up expired
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Email already registered
          schema:
            additionalProperties: true
            type: object
      summary: Complete Social Sign-Up
      tags:
      - Auth
  /auth/social/complete/code:
    post:
      consumes:
      - application/json
      description: 'Second step of an email-less social sign-up: mails a 6-character
        code to the email the user typed. The code is bound to the pending sign-up
        and to that email.'
      parameters:
      - description: Pending sign-up and email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/houseflowApi_internal_models_dtos.SocialSignUpCodeRequestModel'
      produces:
      - application/json
      responses:
        "200":
          description: Code sent
          schema:
            $ref: '#/definitions/houseflowApi_internal_models_dtos.SuccessResponseModel'
        "400":
          description: Bad request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Pending sign-up expired
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Email already registered
          schema:
            additionalProperties: true
            type: object
      summary: Send Social Sign-Up Code
      tags:
      - Auth
  /auth/validate-email:
    get:
      description: Sends a 6-character verification code to the authenticated user's
        email address.
      produces:
      - application/json
      responses:
        "200":
          description: Verification code sent
          schema:
            $ref: '#/definitions/houseflowApi_internal_models_dtos.SuccessResponseModel'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/houseflowApi_internal_models_dtos.SuccessResponseModel'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Send Email Verification Code
      tags:
      - Auth
    post:
      consumes:
      - application/json
      description: Verifies the authenticated user's email address with the submitted
        6-character code.
      parameters:
      - description: Verification code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/houseflowApi_internal_models_dtos.ValidateEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Email verified
          schema:
            $ref: '#/definitions/houseflowApi_internal_models_dtos.SuccessResponseModel'
        "400":
          description: Bad request or invalid code
          schema:
            $ref: '#/definitions/houseflowApi_internal_models_dtos.SuccessResponseModel'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Validate Email
      tags:
      - Auth
  /base/health:
    get:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      tags:
      - Base
  /chore:
    post:
      consumes:
      - application/json
      description: Create a new chore in a house
      parameters:
      - description: Chore object
        in: body
        name: chore
        required: true
        schema:
          $ref: '#/definitions/houseflowApi_internal_models_dtos.CreateChoreModel'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/houseflowApi_internal_models_dtos.ChoreResponseModel'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create new chore
      tags:
      - Chore
  /chore/{id}:
    put:
      consumes:
      - application/json
      description: Update an existing chore
      parameters:
      - description: Chore ID
        in: path
        name: id
        required: true
        type: string
      - description: Chore object
        in: body
        name: chore
        required: true
        schema:
          $ref: '#/definitions/houseflowApi_internal_models_dtos.CreateChoreModel'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/houseflowApi_internal_models_dtos.ChoreResponseModel'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update chore
      tags:
      - Chore
  /chore/{id}/remind:
    post:
      description: Sends the assignee an in-app and push notification. Other house
        members can send it once per chore, during the last 12 hours before the due
        date, while the chore is in Draft or Progress.
      parameters:
      - description: Chore ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/houseflowApi_internal_models_dtos.SuccessResponseModel'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Not a house member
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Chore not found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Reminder already sent
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Remind the assignee of a chore
      tags:
      - Chore
  /chore/{id}/review-photo/{round}:
    get:
      description: Returns a five-minute presigned URL after verifying house membership.
      parameters:
      - description: Chore ID
        in: path
        name: id
        required: true
        type: string
      - description: Review round
        in: path
        name: round
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
