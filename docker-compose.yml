services:
  # HouseFlow API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: houseflow-api
    ports:
      - "3162:3162"
    environment:
      - MONGO_DB=houseflowDb
      - MONGO_URI=mongodb://mongodb:27017/?replicaSet=rs0
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      migration:
        condition: service_completed_successfully
    networks:
      - houseflow-network
    volumes:
      - ./internal/config/config.json:/root/internal/config/config.json

  migration:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: houseflow-migration
    command: ["./houseflowapi", "migrate"]
    environment:
      - MONGO_DB=houseflowDb
      - MONGO_URI=mongodb://mongodb:27017/?replicaSet=rs0
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
    networks:
      - houseflow-network
    volumes:
      - ./internal/config/config.json:/root/internal/config/config.json
    restart: "no"

  # MongoDB
  mongodb:
    image: mongo:latest
    container_name: houseflow-mongodb
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    environment:
      MONGO_INITDB_DATABASE: houseflowDb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - houseflow-network
    logging:
      driver: "none"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping: 1}).ok ? 0 : 1)"]
      interval: 2s
      timeout: 5s
      retries: 30

  mongodb-init:
    image: mongo:latest
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - houseflow-network
    restart: "no"
    entrypoint: ["mongosh", "--host", "mongodb:27017", "--quiet", "--eval"]
    command:
      - |
        try {
          rs.status();
        } catch (e) {
          if (e.code !== 94) throw e;
          const result = rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongodb:27017"}]});
          if (!result.ok) throw new Error(JSON.stringify(result));
        }
        let ready = false;
        for (let attempt = 0; attempt < 60; attempt++) {
          if (db.hello().isWritablePrimary) { ready = true; break; }
          sleep(1000);
        }
        if (!ready) throw new Error("MongoDB primary did not become ready");

  # Ephemeral multi-instance coordination state
  redis:
    image: redis:8.2-alpine
    container_name: houseflow-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - houseflow-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  integrationTests:
    image: golang:1.24-alpine
    profiles: ["test"]
    working_dir: /app
    environment:
      - HOUSEFLOW_TEST_MONGO_URI=mongodb://mongodb:27017/?replicaSet=rs0
      - HOUSEFLOW_TEST_REDIS_URL=redis://redis:6379/15
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - houseflow-network
    volumes:
      - .:/app
    command: ["go", "test", "./tests", "-count=1"]

  # Optional: Mongo Express (MongoDB yönetim paneli)
  mongo-express:
    image: mongo-express:latest
    container_name: houseflow-mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: password
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/?replicaSet=rs0
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
    networks:
      - houseflow-network
    logging:
      driver: "none"

volumes:
  mongodb-data:

networks:
  houseflow-network:
    driver: bridge
